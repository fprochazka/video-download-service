[project]
name = "video-download"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.162.0",
    "fastmcp>=4.1.4",
    "google-genai>=2.34.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
    "yt-dlp[default,deno]>=2026.10.26",
]

[dependency-groups]
dev = [
    "fastmcp-tasks>=4.1.4",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
