version: '3.8'

services:
  video-download:
    build: ./service
    container_name: video-download
    # The uid:gid the app runs as, so the files it writes to the bind mounts belong to the host user, see service/README.md
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    networks:
      - video-download-network
    expose:
      - "8000"
    volumes:
      - ./downloads:/app/downloads
      - ./instagram_cookies.txt:/app/instagram_cookies.txt
      - ./extractor_config.py:/app/extractor_config.py:ro
    restart: unless-stopped
    # PUBLIC_BASE_URL, TRANSCRIPTION_PROVIDER with its API key and the other settings, see app.env.example; without it
    # transcription is off and /mcp answers only localhost
    env_file:
      - path: app.env
        required: false
    environment:
      - PYTHONUNBUFFERED=1

  ts-video-download:
    image: tailscale/tailscale:latest
    env_file:
      - .env
    environment:
      - TS_HOSTNAME=video-download
      - TS_EXTRA_ARGS=--advertise-tags=tag:service
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/mcp.json
    networks:
      - video-download-network
    volumes:
      - tailscale-data-video-download:/var/lib/tailscale
      - ./ts-video-download/config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

networks:
  video-download-network:
    driver: bridge

volumes:
  tailscale-data-video-download:
    driver: local
