name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: service/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff check
        run: uv run ruff check --output-format github .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: service/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      # The audio extraction and voice activity detection tests run ffmpeg, pytest skips them without it
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # The runner has Node.js, so the page script tests run here instead of being skipped
      - name: Run tests
        run: uv run pytest

  cli:
    name: CLI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff check
        run: uv run ruff check --output-format github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy --strict src tests

      - name: Run tests
        run: uv run pytest

  docker:
    # The image is what runs in production, built by hand on the server, so a broken Dockerfile
    # or a dependency without a wheel for the base image would otherwise only show up on deploy.
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t video-download:ci service

      # yt-dlp needs Deno for YouTube and ffmpeg for merging, both easy to lose in a Dockerfile change.
      # Both checks run as uid 1000 like docker-compose.yml, so a path that only root can write shows up here.
      - name: yt-dlp finds Deno and ffmpeg
        run: |
          # about:blank is not a video, so yt-dlp exits 1, but only after printing the debug header checked below
          docker run --rm --user 1000:1000 video-download:ci yt-dlp -v --simulate about:blank > ytdlp.log 2>&1 || true
          cat ytdlp.log
          grep -q 'JS runtimes: deno' ytdlp.log
          grep -q 'exe versions: ffmpeg' ytdlp.log

      # The transcription cuts long recordings at the pauses Silero finds; its native library must load in the image
      - name: The voice activity detector runs
        run: |
          docker run --rm --user 1000:1000 video-download:ci sh -c \
            'ffmpeg -nostdin -loglevel error -f lavfi -i sine=duration=3 -ac 1 -c:a libopus /tmp/tone.ogg && python -m video_download.vad /tmp/tone.ogg' > vad.json
          cat vad.json
          grep -q '"regions"' vad.json

      - name: The app starts and serves the page
        run: |
          docker run -d --name app --user 1000:1000 -p 8000:8000 video-download:ci
          for attempt in $(seq 30); do curl -sf -o /dev/null http://localhost:8000/ && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:8000/ || { docker logs app; exit 1; }
